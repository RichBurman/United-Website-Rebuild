<section class="blog-page">
  <div class="container">
    <div class="blog-header">
      <h1>United Blog</h1>
      <p>Latest thoughts, analysis and opinion on Manchester United.</p>
    </div>

    <div class="tag-filters">
      @for (tag of tagOptions; track tag) {
        <button
          type="button"
          class="tag-filter"
          [class.active]="selectedTag() === tag"
          (click)="selectedTag.set(tag)"
        >
          {{ tag }}
        </button>
      }
    </div>

    <div class="blog-grid">
      @for (post of filteredPosts(); track post.id) {
        <app-blog-card [post]="post" />
      }
    </div>
  </div>
</section>
