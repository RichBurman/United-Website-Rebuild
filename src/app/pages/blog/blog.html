<section class="blog-page">
  <div class="container">
    <div class="blog-header">
      <h1>United Blog</h1>
      <p>Latest thoughts, analysis and opinion on Manchester United.</p>
    </div>

    @if (posts | async; as blogPosts) {
      <div class="blog-grid">
        @for (post of blogPosts; track post.id) {
          <app-blog-card [post]="post" />
        }
      </div>
    }
  </div>
</section>
