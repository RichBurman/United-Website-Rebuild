<section class="blog-post-page">
  <div class="container">
    @if (post | async; as blogPost) {
      <a class="back-link" routerLink="/blog"> ← Back to Blog </a>
      <article class="blog-post">
        <header class="post-header">
          <p class="post-date">
            {{ blogPost.publishedAt | date: "d MMMM yyyy" }}
          </p>

          <h1>{{ blogPost.title }}</h1>

          <p class="post-author">By {{ blogPost.author }}</p>
        </header>

        @if (blogPost.imageUrl) {
          <img class="post-image" [src]="blogPost.imageUrl" [alt]="blogPost.title" />
        }

        <div class="post-content">
          <p>{{ blogPost.content }}</p>
        </div>
      </article>
    } @else {
      <h1>Blog post not found</h1>
    }
  </div>
</section>
