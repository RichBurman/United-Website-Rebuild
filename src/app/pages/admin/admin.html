<section class="admin-page">
  @if (isLoggedIn()) {
    <div class="admin-dashboard">
      <h1>Blog Admin</h1>

      <p>You are logged in.</p>

      <p>From here you will be able to create, edit and delete blog posts.</p>

      <button type="button" (click)="logout()">Log Out</button>
    </div>
  } @else {
    <div class="login-card">
      <h1>Admin Login</h1>

      <p>Sign in to manage blog posts.</p>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">Email</label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
          />
        </div>

        @if (errorMessage()) {
          <p class="error-message">
            {{ errorMessage() }}
          </p>
        }

        <button type="submit" [disabled]="isLoading()">
          @if (isLoading()) {
            Signing in...
          } @else {
            Sign In
          }
        </button>
      </form>
    </div>
  }
</section>
