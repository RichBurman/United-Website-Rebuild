<section class="league-table-page">
  <h1>League Table</h1>

  @if (leagueTable$ | async; as teams) {
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Team</th>
          <th>Pl</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>GD</th>
          <th>Pts</th>
        </tr>
      </thead>

      <tbody>
        @for (team of teams; track team.teamName) {
          <tr>
            <td>{{ team.position }}</td>
            <td>{{ team.teamName }}</td>
            <td>{{ team.playedGames }}</td>
            <td>{{ team.won }}</td>
            <td>{{ team.draw }}</td>
            <td>{{ team.lost }}</td>
            <td>{{ team.goalDifference }}</td>
            <td>{{ team.points }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
